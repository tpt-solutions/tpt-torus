[package]
name = "tpt-torus-cxx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "C-compatible FFI and C++20 coroutine wrapper for TPT Torus."
readme = "README.md"
keywords = ["ffi", "cxx", "coroutines", "async-io"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "tpt_torus_cxx"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "generate-header"
path = "src/bin/generate_header.rs"
required-features = ["generate-header"]

[dependencies]
tpt-torus-core = { path = "../tpt-torus-core", version = "0.1.0" }
libc = "0.2"

# Platform backend selection for the C `torus_create` entry point.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))))'.dependencies]
tpt-torus-backend-uring = { path = "../tpt-torus-backend-uring", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
tpt-torus-backend-iocp = { path = "../tpt-torus-backend-iocp", version = "0.1.0" }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
tpt-torus-backend-kqueue = { path = "../tpt-torus-backend-kqueue", version = "0.1.0" }

[dependencies.cbindgen]
version = "0.27"
optional = true

[features]
default = []
generate-header = ["cbindgen"]

[package]
name = "tpt-torus-backend-iocp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Windows IOCP backend engine for TPT Torus."

[lib]
name = "tpt_torus_backend_iocp"
path = "src/lib.rs"

[dependencies]
tpt-torus-sys = { path = "../tpt-torus-sys" }
tpt-torus-core = { path = "../tpt-torus-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinSock",
] }

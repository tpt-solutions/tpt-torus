[package]
name = "tpt-torus-fuzz"
version = "0.0.0"
authors = ["TPT Torus contributors"]
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
libc = "0.2"

[dependencies.tpt-torus-core]
path = "../tpt-torus-core"

[[bin]]
name = "flow_creation"
path = "fuzz_targets/flow_creation.rs"
test = false
doc = false

[[bin]]
name = "result_parsing"
path = "fuzz_targets/result_parsing.rs"
test = false
doc = false

[[bin]]
name = "operation_validate"
path = "fuzz_targets/operation_validate.rs"
test = false
doc = false
